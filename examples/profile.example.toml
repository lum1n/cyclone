schema_version = 1
notes = "Example profile — copy paths to match your machine before capture. Edit after `cyclone init`."

[[components]]
id = "gitconfig"
kind = "dotfile"
include = true
linux = "~/.gitconfig"
macos = "~/.gitconfig"
supported_platforms = ["linux", "macos"]

[[components]]
id = "nvim"
kind = "config-tree"
include = true
linux = "~/.config/nvim"
macos = "~/.config/nvim"
supported_platforms = ["linux", "macos"]

[[components]]
id = "vscode-settings"
kind = "dotfile"
include = true
linux = "~/.config/Code/User/settings.json"
macos = "~/Library/Application Support/Code/User/settings.json"
supported_platforms = ["linux", "macos"]

# Live dump from `brew list` when `brew` is on PATH. You do not write this file.
# A handwritten Brewfile is only captured if you opt it in as a dotfile (kind = "dotfile").
[[components]]
id = "brewfile"
kind = "tool-manifest"
include = true
linux = "~/Brewfile"
macos = "~/Brewfile"
supported_platforms = ["linux", "macos"]
package_manager = "homebrew"

[[components]]
id = "tmux-conf"
kind = "dotfile"
include = true
linux = "~/.tmux.conf"
macos = "~/.tmux.conf"
supported_platforms = ["linux", "macos"]

# Paths below are where the live dump is stored in the image / written on restore.
# Capture runs apt/dnf/pacman/yay/paru — do not create these .list files yourself.
[[components]]
id = "apt-packages"
kind = "tool-manifest"
include = true
linux = "~/.config/apt/packages.list"
supported_platforms = ["linux"]
package_manager = "apt"

[[components]]
id = "dnf-packages"
kind = "tool-manifest"
include = false
linux = "~/.config/dnf/packages.list"
supported_platforms = ["linux"]
package_manager = "dnf"

[[components]]
id = "pacman-packages"
kind = "tool-manifest"
include = false
linux = "~/.config/pacman/packages.list"
supported_platforms = ["linux"]
package_manager = "pacman"

[[components]]
id = "yay-packages"
kind = "tool-manifest"
include = false
linux = "~/.config/yay/packages.list"
supported_platforms = ["linux"]
package_manager = "yay"

[[components]]
id = "paru-packages"
kind = "tool-manifest"
include = false
linux = "~/.config/paru/packages.list"
supported_platforms = ["linux"]
package_manager = "paru"

# Discovered by the home scan; left out unless you opt in.
[[components]]
id = "ssh-id-ed25519"
kind = "dotfile"
include = false
linux = "~/.ssh/id_ed25519"
macos = "~/.ssh/id_ed25519"
supported_platforms = ["linux", "macos"]
opt_in = "ssh-private-key"

[[secret_references]]
name = "GITHUB_TOKEN"
provider = "prompt"
