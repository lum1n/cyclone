[workspace]
resolver = "2"
members = [
    "crates/cyclone",
    "crates/cyclone-core",
    "crates/cyclone-ext-exe",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/lum1n/cyclone"

[workspace.dependencies]
anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
base64 = "0.22"
chacha20poly1305 = { version = "0.10", features = ["std"] }
clap = { version = "4.5", features = ["derive", "env"] }
directories = "5"
walkdir = "2"
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# 2.12.x is MSRV-friendly when `url`/`idna` stay on the rustc 1.85 line in Cargo.lock
# (newer `idna` pulls `icu` 2.4, which needs rustc 1.88).
ureq = "2.12.1"
zeroize = { version = "1", features = ["derive"] }

cyclone-core = { path = "crates/cyclone-core" }
cyclone-ext-exe = { path = "crates/cyclone-ext-exe" }
